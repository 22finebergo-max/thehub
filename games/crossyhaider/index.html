<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7ad34a">
<title>Crossy Haider</title>
<script src="../../js/sound-guard.js"></script>
<script src="three.min.js"></script>
<style>
:root{--font:"Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--font);color:#fff;overflow:hidden;overscroll-behavior:none;background:#8fe0f7;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:5}
#score{font-size:64px;font-weight:900;line-height:1;color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 #2b2b2b,0 0 0 #000,3px 3px 0 #2b2b2b,-3px -3px 0 #2b2b2b,3px -3px 0 #2b2b2b,-3px 3px 0 #2b2b2b}
#best{margin-top:6px;font-size:14px;font-weight:900;background:rgba(0,0,0,.28);border-radius:999px;padding:4px 12px}
#mute{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:9;width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,30,20,.45);color:#fff;font-size:19px;cursor:pointer}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(20,40,20,.35);z-index:20}
.overlay.on{display:flex}
.card{background:#fff;color:#1f2a1f;border-radius:26px;padding:22px 20px 20px;width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 16px 0 rgba(0,0,0,.25),0 24px 40px rgba(0,0,0,.35);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.logo{margin:0;font-size:44px;line-height:.95;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 5px 0 #2b2b2b,4px 4px 0 #2b2b2b,-4px 4px 0 #2b2b2b,4px -4px 0 #2b2b2b,-4px -4px 0 #2b2b2b}
.card h2{margin:0;font-size:28px}
.card p{margin:0;font-size:15px;line-height:1.35;opacity:.85}
.big{font-size:56px;font-weight:900;line-height:1;color:#ff8a2b}
.btn{font:inherit;font-weight:900;font-size:20px;color:#fff;border:0;border-radius:16px;padding:14px 18px;width:100%;cursor:pointer;background:#5fcf3e;box-shadow:0 6px 0 #2f8a1c;transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #2f8a1c}
.btn.alt{background:#ffb13b;box-shadow:0 6px 0 #b8721a}
.btn.alt:active{box-shadow:0 1px 0 #b8721a}
.hint{font-size:14px!important;opacity:.6!important}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="fx"></canvas>
<div id="hud"><div id="score">0</div><div id="best">Best 0</div></div>
<button id="mute" onclick="toggleMute()" aria-label="Sound on or off">🔊</button>

<div id="start" class="overlay on"><div class="card">
  <h1 class="logo" style="color:#fff">CROSSY<br>HAIDER</h1>
  <p>Hop forward and don't get squished!</p>
  <p class="hint">Tap or swipe to hop. Use the arrow keys on a computer.</p>
  <button class="btn" onclick="playNow()">▶ Play</button>
</div></div>

<div id="over" class="overlay"><div class="card">
  <h2>Splat!</h2>
  <div class="big" id="finalScore">0</div>
  <p id="overMsg">You made it this far.</p>
  <button class="btn" onclick="playNow()">🔁 Play again</button>
  <button class="btn alt" onclick="backToStart()">🏠 Menu</button>
</div></div>

/* ---------- sound and haptics (respects the hub switches) ---------- */
let muted=false;
try{ muted = localStorage.getItem('crossy-mute')==='1'; }catch(e){}
function hubSound(){ try{ return localStorage.getItem('gamehub-sound')!=='0'; }catch(e){ return true; } }
function soundOn(){ return hubSound() && !muted; }
function buzz(p){ try{ if(localStorage.getItem('gamehub-haptics')!=='0' && navigator.vibrate) navigator.vibrate(p); }catch(e){} }
let actx=null;
function ac(){ try{ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx && actx.state==='suspended') actx.resume(); }catch(e){} return actx; }
function tone(f,d,type,vol,when,slide){
  if(!soundOn()) return; const a=ac(); if(!a) return;
  const t=a.currentTime+(when||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol||.15,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.03);
}
const SFX={
  hop(){ tone(520,.07,'triangle',.12,0,200); },
  land(){ tone(260,.05,'sine',.08); },
  squash(){ tone(140,.2,'square',.16,0,-90); tone(90,.25,'sawtooth',.12,.05,-40); },
  splash(){ tone(380,.28,'sine',.12,0,-260); },
  honk(){ tone(420,.18,'square',.08); tone(420,.18,'square',.08,.2); },
  point(){ tone(880,.08,'triangle',.1); },
  best(){ [660,880,1100].forEach((f,i)=>tone(f,.16,'triangle',.13,i*.09)); }
};
function paintMute(){ $('mute').textContent = soundOn() ? '🔊' : '🔇'; }
function toggleMute(){
  if(!hubSound()){ alert('Sound is switched off in the hub settings.'); return; }
  muted=!muted; try{ localStorage.setItem('crossy-mute', muted?'1':'0'); }catch(e){}
  paintMute(); if(!muted) SFX.hop();
}

/* ---------- textures ---------- */
const TEX={};
function facePhoto(key,ring){                      // round face for a decal
  const k=key+ring; if(TEX[k]) return TEX[k];
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const im=PHOTO[key];
  g.save(); g.beginPath(); g.arc(64,64,56,0,6.2832); g.clip();
  g.fillStyle=ring; g.fillRect(0,0,128,128);
  if(im.complete && im.naturalWidth) g.drawImage(im,8,8,112,112);
  g.restore();
  g.lineWidth=7; g.strokeStyle='#fff'; g.beginPath(); g.arc(64,64,59,0,6.2832); g.stroke();
  return TEX[k]=new THREE.CanvasTexture(c);
}
function coverTex(key,cw,ch,fy){                   // photo cover-cropped onto a long face (trains)
  const k='cover'+key+cw+'x'+ch+fy; if(TEX[k]) return TEX[k];
  const c=document.createElement('canvas'); c.width=cw; c.height=ch; const g=c.getContext('2d');
  const im=PHOTO[key];
  if(im.complete && im.naturalWidth){
    const ar=cw/ch; let sw=im.width, sh=sw/ar; if(sh>im.height){ sh=im.height; sw=sh*ar; }
    const sx=(im.width-sw)/2, sy=(im.height-sh)*fy; g.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
  } else { g.fillStyle='#444'; g.fillRect(0,0,cw,ch); }
  return TEX[k]=new THREE.CanvasTexture(c);
}
function labelTex(txt,fg,bg){                      // text on a lily pad (Ben)
  const k='lbl'+txt+fg+bg; if(TEX[k]) return TEX[k];
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  g.fillStyle=bg; g.beginPath(); g.arc(64,64,62,0,6.2832); g.fill();
  g.fillStyle=fg; g.font='900 48px "Arial Rounded MT Bold",Arial,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(txt,64,68);
  return TEX[k]=new THREE.CanvasTexture(c);
}

const canvas=$('cv');

renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fe0f7);
scene.fog=new THREE.Fog(0x8fe0f7, 26, 48);
const camera=new THREE.PerspectiveCamera(36, 1, .1, 200);
const CAM_OFF=new THREE.Vector3(0,14,16);
const hemi=new THREE.HemisphereLight(0xffffff,0x5f8f3a,.9); scene.add(hemi);

function resize(){

  renderer.setSize(w,h,false); camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const MAT={};
const mat=c=>MAT[c]||(MAT[c]=new THREE.MeshLambertMaterial({color:c}));
const GEO={};
function bx(w,h,d){ const k=w+'_'+h+'_'+d; return GEO[k]||(GEO[k]=new THREE.BoxGeometry(w,h,d)); }
function add(parent,w,h,d,color,x,y,z){
  const m=new THREE.Mesh(bx(w,h,d), Array.isArray(color)?color:mat(color));
  m.position.set(x,y,z); parent.add(m); return m;
}
function blob(parent,w,d,x,z){
  const m=new THREE.Mesh(new THREE.CircleGeometry(.5,16), new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22,depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.scale.set(w,d,1); m.position.set(x,.02,z); parent.add(m); return m;
}
function decal(parent,key,ring,w,x,y,z,ry){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w), new THREE.MeshBasicMaterial({map:facePhoto(key,ring),transparent:true}));
  m.position.set(x,y,z); if(ry) m.rotation.y=ry; parent.add(m); return m;
}

/* ---------- world (rows) ---------- */
const ROW=1, HALF=7, WORLD_HALF=15;
const world=new THREE.Group(); scene.add(world);
const rows=new Map();
let seed=20260;
function rnd(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function range(a,b){ return a+(b-a)*rnd(); }

function makeTree(parent,x,z,s){
  const g=new THREE.Group(); g.position.set(x,0,z); g.scale.setScalar(s||1);
  add(g,.28,.5,.28,0x8a5a2b,0,.25,0);
  add(g,1.0,.62,1.0,0x7fb840,0,.8,0);
  add(g,.82,.5,.82,0x95c94e,0,1.35,0);
  add(g,.6,.4,.6,0xa8d966,0,1.78,0);
  parent.add(g);
}
function makeStone(parent,x,z){
  const g=new THREE.Group(); g.position.set(x,0,z);
  add(g,.9,.36,.9,0xa79ccd,0,.18,0);
  add(g,.66,.3,.66,0xb9aedd,0,.5,0);
  add(g,.4,.2,.4,0xc8bfe6,0,.7,0);
  parent.add(g);
}

function genRow(r){
  if(r<=3) return {r,type:'grass',trees:[],stones:[]};
  const prev=rows.get(r-1);
  let kind;
  const roll=rnd();
  if(prev && (prev.type==='rail'||prev.type==='water') && roll<.6) kind='grass';
  else if(roll<.36) kind='grass';
  else if(roll<.66) kind='road';
  else if(roll<.8) kind='rail';
  else kind='water';
  if(prev && prev.type===kind && kind!=='grass') kind='grass';
  if(kind==='grass'){
    const trees=[], n=Math.floor(range(0,3.6));
    for(let i=0;i<n;i++){ const c=Math.round(range(-6,6)); if(!trees.includes(c)) trees.push(c); }
    const stones=rnd()<.4 ? [Math.round(range(-5,5))] : [];
    return {r,type:'grass',trees:trees.filter(c=>!stones.includes(c)),stones};
  }
  if(kind==='road'){
    const dir=rnd()<.5?1:-1, speed=range(2.6,4.4)*dir, cars=[];
    let x=range(-13,-9);
    while(x<14){ cars.push({x, w:1.6, color: pick([0xe8e8f0,0xf36b6b,0x5cb8ff,0xffd166,0x9be564])}); x+=range(3.8,6.2); }
    return {r,type:'road',speed,cars};
  }
  if(kind==='rail'){
    return {r,type:'rail',dir:rnd()<.5?1:-1,nextT:range(1.5,4),warn:0,train:null};
  }
  // water: lily pads (Ben)
  const dir=rnd()<.5?1:-1, speed=range(.9,1.7)*dir, pads=[];
  let x=range(-12,-9);
  while(x<13){ pads.push({x, w:1.5}); x+=range(2.7,3.6); }
  return {r,type:'water',speed,pads};
}

function buildRow(d){
  const g=new THREE.Group(); g.position.z=-d.r*ROW; world.add(g); d.group=g;
  const band = d.r%2===0;
  if(d.type==='grass'){
    add(g,WORLD_HALF*2,.5,ROW*.98, band?0x9ad84a:0x8fd142, 0,-.25,0);
    for(const c of d.trees) makeTree(g,c,0,1);
    for(const c of d.stones) makeStone(g,c,0);
  } else if(d.type==='road'){
    add(g,WORLD_HALF*2,.5,ROW*.98,0x4c5058,0,-.25,0);
    for(let x=-WORLD_HALF;x<=WORLD_HALF;x+=1.6) add(g,.7,.02,.09,0xf4f1e6,x,.02,0);
    add(g,WORLD_HALF*2,.02,.05,0xf2c94c,0,.02,-.42);  // kerb marks
    d.carMeshes=d.cars.map(c=>{
      const cg=new THREE.Group(); cg.position.set(c.x,0,0); g.add(cg);
      add(cg,1.6,.52,.86,c.color,0,.36,0);
      add(cg,.82,.5,.8,0xf5f6fa,-.08,.8,0);
      add(cg,.7,.26,.82,0x2d3440,-.08,.84,0);
      decal(cg,'amaan','#ffffff',.62,0,.38,.44);
      blob(cg,1.8,.9,0,0);
      return cg;
    });
  } else if(d.type==='rail'){
    add(g,WORLD_HALF*2,.5,ROW*.98,0x7b8a4a,0,-.25,0);
    for(let x=-WORLD_HALF;x<=WORLD_HALF;x+=.9) add(g,.2,.05,.9,0x7a4c2f,x,.02,0);
    add(g,WORLD_HALF*2,.06,.1,0xb8c0cc,0,.05,-.22);
    add(g,WORLD_HALF*2,.06,.1,0xb8c0cc,0,.05,.22);
    d.lights=[]; for(const sx of [-6.5,6.5]){ const l=add(g,.2,.6,.2,0xff3b30,sx,.4,0); d.lights.push(l); }
    d.trainMesh=null;
  } else {
    add(g,WORLD_HALF*2,.5,ROW*.98,0x5fcfef,0,-.25,0);
    for(let x=-WORLD_HALF;x<=WORLD_HALF;x+=2.2) add(g,.9,.02,.04,0xd9f7ff,x,.01,(x%4.4)?.25:-.25);
    d.padMeshes=d.pads.map(p=>{
      const pg=new THREE.Group(); pg.position.set(p.x,0,0); g.add(pg);
      const pad=new THREE.Mesh(new THREE.CylinderGeometry(.75,.75,.1,22), mat(0x4fb85a)); pad.position.y=.05; pg.add(pad);
      const notch=new THREE.Mesh(bx(.5,.12,.2), mat(0x5fcfef)); notch.position.set(.55,.06,.02); pg.add(notch);
      const lbl=new THREE.Mesh(new THREE.PlaneGeometry(1.05,1.05), new THREE.MeshBasicMaterial({map:facePhoto('ben','#3ea84e'),transparent:true}));
      lbl.rotation.x=-Math.PI/2; lbl.position.y=.11; pg.add(lbl);
      return pg;
    });
  }
  return d;
}

function ensureRows(upTo){
  for(let r=0;r<=upTo;r++){
    if(!rows.has(r)){ const d=genRow(r); rows.set(r,d); buildRow(d); }
  }
  for(const [r,d] of rows){
    if(r<G.row-12){ world.remove(d.group); rows.delete(r); }
  }
}

/* ---------- chicken: Haider ---------- */
function squarePhoto(key){
  const k='sq'+key; if(TEX[k]) return TEX[k];
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  const im=PHOTO[key];
  if(im.complete && im.naturalWidth) g.drawImage(im,0,0,256,256); else { g.fillStyle='#888'; g.fillRect(0,0,256,256); }
  return TEX[k]=new THREE.CanvasTexture(c);
}
const chicken=new THREE.Group(); scene.add(chicken);
const chickenBody=new THREE.Group(); chicken.add(chickenBody); chickenBody.scale.setScalar(1.35);
const hm=new THREE.MeshLambertMaterial({color:0xffffff});
add(chickenBody,.72,.62,.72,[hm,hm,hm,hm,hm,hm],0,.55,0);
add(chickenBody,.5,.5,.5,[hm,hm,hm,hm,hm,hm],0,1.02,-.06);
add(chickenBody,.18,.22,.18,0xe53935,0,1.36,-.06);
add(chickenBody,.16,.14,.22,0xff9800,0,.98,-.42);
add(chickenBody,.08,.34,.08,0xff9800,-.18,.17,0);
add(chickenBody,.08,.34,.08,0xff9800,.18,.17,0);
blob(chicken,1,.9,0,0);

/* ---------- game state ---------- */
const G={row:0, x:0, z:0, hop:null, dead:false, running:false, maxRow:0, best:0, t:0, shake:0, squash:0, sinking:0};
try{ G.best=+(localStorage.getItem('crossy-best')||0)||0; }catch(e){}
$('best').textContent='Best '+G.best;

/* ---------- train + car movement ---------- */
function updateRows(dt){
  for(const [r,d] of rows){
    if(d.type==='road'){
      for(let i=0;i<d.cars.length;i++){
        const c=d.cars[i]; c.x+=d.speed*dt;
        if(d.speed>0 && c.x>WORLD_HALF+2) c.x-=WORLD_HALF*2+4;
        if(d.speed<0 && c.x<-WORLD_HALF-2) c.x+=WORLD_HALF*2+4;
        d.carMeshes[i].position.x=c.x;
      }
    } else if(d.type==='rail'){
      d.nextT-=dt;
      if(!d.train && d.nextT<=1.5){ d.warn=1; }
      if(!d.train && d.nextT<=0){
        const sp=17*d.dir;
        d.train={x:-WORLD_HALF*-1*-d.dir*1.4 - 0, speed:sp};
        d.train.x = d.dir>0 ? -WORLD_HALF-6 : WORLD_HALF+6;
        const tg=new THREE.Group(); d.group.add(tg); d.trainMesh=tg;
        const side=[coverTex('bartu',512,116,.2), coverTex('bartu',512,116,.2)];
        const sideM=new THREE.MeshLambertMaterial({map:side[0]});
        const top=new THREE.MeshLambertMaterial({map:coverTex('bartu',256,160,.15)});
        const nose=mat(0xe53935), dark=mat(0x2b2b2b);
        add(tg,6.2,1.2,.92,[nose,dark,top,dark,sideM,sideM],0,.6,0);
        for(const wx of [-2.2,-.6,1,2.6]) add(tg,.5,.3,.98,0x2b2b2b,wx,.15,0);
        d.warn=0;
      }
      if(d.train){
        d.train.x += d.train.speed*dt;
        d.trainMesh.position.x=d.train.x;
        if(Math.abs(d.train.x)>WORLD_HALF+10){ d.group.remove(d.trainMesh); d.train=null; d.trainMesh=null; d.nextT=range(2,4.5); }
      }
      const blink = Math.floor(G.t*6)%2===0;
      for(const l of d.lights) l.material.color.set(d.warn||d.train ? (blink?0xff3b30:0x6b1a16) : 0x6b1a16);
    } else if(d.type==='water'){
      for(let i=0;i<d.pads.length;i++){
        const p=d.pads[i]; p.x+=d.speed*dt;
        if(d.speed>0 && p.x>WORLD_HALF+2) p.x-=WORLD_HALF*2+4;
        if(d.speed<0 && p.x<-WORLD_HALF-2) p.x+=WORLD_HALF*2+4;
        d.padMeshes[i].position.x=p.x;
      }
    }
  }
}

/* ---------- collisions ---------- */
function rowAt(r){ return rows.get(r); }
function checkStanding(dt){
  const d=rowAt(G.row); if(!d) return;
  if(d.type==='road'){
    for(const c of d.cars) if(Math.abs(c.x-G.x) < .8+.38) return die('car');
  } else if(d.type==='rail'){
    if(d.train){
      const tx=d.train.x, half=3.1;
      if(Math.abs(tx-G.x) < half+.36) return die('train');
    }
  } else if(d.type==='water'){
    if(G.hop) return;
    const on=d.pads.some(p=>Math.abs(p.x-G.x) < p.w/2+.3);
    if(!on) return die('water');
    // ride the pad
    const pad=d.pads.find(p=>Math.abs(p.x-G.x) < p.w/2+.3);
    G.x += d.speed*(dt||0);
    if(Math.abs(G.x)>WORLD_HALF-.5) return die('water');
  }
}

/* ---------- hopping ---------- */
function tryHop(dr,dc){
  if(!G.running || G.dead || G.hop) return;
  const targetRow=G.row+dr;
  const tc=Math.round(G.x)+dc;
  if(Math.abs(tc)>HALF) return bump();
  if(targetRow<0) return bump();
  const td=rowAt(targetRow);
  if(td && td.type==='grass' && td.trees.includes(tc)) return bump();
  if(td && td.type==='grass' && td.stones.includes(tc)) return bump();
  G.hop={fromX:G.x, toX:tc, fromR:G.row, toR:targetRow, t:0, dur:.18};
  SFX.hop(); buzz(6);
}
function bump(){ G.shake=Math.max(G.shake,.08); SFX.land(); }

function landed(){
  G.row=G.hop.toR; G.x=G.hop.toX; G.hop=null;
  SFX.land();
  if(G.row>G.maxRow){ G.maxRow=G.row; $('score').textContent=G.maxRow; if(G.maxRow%5===0) SFX.point(); }
  ensureRows(G.row+20);
  checkStanding(0);
}

/* ---------- death ---------- */
function die(kind){
  if(G.dead) return;
  G.dead=true; G.hop=null;
  if(kind==='water'){ G.sinking=1; SFX.splash(); buzz([30,40,30]); }
  else { G.squash=1; SFX.squash(); buzz([60,40,120]); G.shake=.6; }
  if(kind==='train' || kind==='car') SFX.honk();
  const isBest=G.maxRow>G.best;
  if(isBest){ G.best=G.maxRow; try{ localStorage.setItem('crossy-best',G.best); }catch(e){} $('best').textContent='Best '+G.best; }
  setTimeout(()=>{
    $('finalScore').textContent=G.maxRow;
    $('overMsg').textContent = isBest ? 'New best! Can you beat it?' : `Best so far: ${G.best}`;
    $('over').classList.add('on');
    if(isBest) setTimeout(()=>SFX.best(),200);
  }, 950);
}

/* ---------- input ---------- */
let ptr=null;
canvas.addEventListener('pointerdown', e=>{ ptr={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('pointerup', e=>{
  if(!ptr) return;
  const dx=e.clientX-ptr.x, dy=e.clientY-ptr.y; ptr=null;
  if(Math.hypot(dx,dy)<18){ return tryHop(1,0); }
  if(Math.abs(dx)>Math.abs(dy)) tryHop(0, dx>0?1:-1);
  else tryHop(dy<0?1:-1, 0);
});
addEventListener('keydown', e=>{
  const k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W') tryHop(1,0);
  else if(k==='ArrowDown'||k==='s'||k==='S') tryHop(-1,0);
  else if(k==='ArrowLeft'||k==='a'||k==='A') tryHop(0,-1);
  else if(k==='ArrowRight'||k==='d'||k==='D') tryHop(0,1);
  else return;
  e.preventDefault();
});

/* ---------- start / restart ---------- */
function clearWorld(){
  for(const [r,d] of rows) world.remove(d.group);
  rows.clear();
  if(chicken.parent) {}
}
function playNow(){
  $('start').classList.remove('on'); $('over').classList.remove('on');
  clearWorld();
  if(!PHOTO.haider.complete){ photosReady.then(playNow); return; }
  seed=20260+Math.floor(Math.random()*1000);
  Object.assign(G,{row:0,x:0,z:0,hop:null,dead:false,running:true,maxRow:0,t:0,shake:0,squash:0,sinking:0});
  $('score').textContent='0';
  ensureRows(20);
  G.running=true;
  SFX.start && SFX.start();
  paintMute();
}
function backToStart(){ $('over').classList.remove('on'); $('start').classList.add('on'); G.running=false; clearWorld(); }

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G.running){
    G.t+=dt;
    if(G.hop){
      const h=G.hop; h.t+=dt/h.dur;
      const k=Math.min(1,h.t), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      G.x=h.fromX+(h.toX-h.fromX)*e;
      G.z=h.fromR+(h.toR-h.fromR)*e;
      if(h.t>=1) landed();
    }
    if(!G.dead){
      updateRows(dt);
      if(!G.hop){ checkStanding(dt); }
    }
    if(G.squash>0){ G.squash=Math.max(0,G.squash-dt*3); }
    if(G.sinking>0){ G.sinking=Math.min(1,G.sinking+dt*1.6); }
  }
  // chicken pose
  const baseZ=-G.z*ROW;
  const hopY = G.hop ? Math.sin(Math.min(1,G.hop.t)*Math.PI)*.55 : 0;
  chicken.position.set(G.x, hopY, baseZ);
  const ang = G.hop ? (G.hop.toR<G.hop.fromR?0:Math.PI) : (G.hop?0:(G.lastFacing||0));
  chickenBody.scale.set(1+G.squash*.5, Math.max(.12, 1-G.squash*.85), 1+G.squash*.2);
  chickenBody.position.y = -G.sinking*1.2;
  chickenBody.rotation.x = G.sinking*.9;
  if(G.dead && G.squash>0) chicken.scale.set(1,1,1);
  // camera follows
  const lookX=G.x*.35, lookZ=baseZ;
  const shake=G.shake; G.shake=Math.max(0,G.shake-dt*2.5);
  camera.position.set(lookX+CAM_OFF.x+(Math.random()-.5)*shake, CAM_OFF.y, lookZ+CAM_OFF.z+(Math.random()-.5)*shake);
  camera.lookAt(lookX, .6, lookZ);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
paintMute();
requestAnimationFrame(frame);
photosReady.then(()=>{ hm.map=squarePhoto('haider'); hm.needsUpdate=true; clearWorld(); ensureRows(20); });

</script>
