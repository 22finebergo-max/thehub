<script>
/* Saves this player's progress to the hub's Supabase project (player_progress table, locked to each player by Row Level Security). */
(function(){
  var GAME='subwaygeorges';
  var loaded={}, loadP=null, saved=false, showForm=false;
  function num(id){ return parseInt((document.getElementById(id)||{}).textContent,10)||0; }
  function localBest(){ try{ return +localStorage.getItem('sg-best')||0; }catch(e){ return 0; } }
  function status(text,ok){ var e=document.getElementById('sgSave'); if(!e) return; e.textContent=text; e.style.color=ok===false?'#ffb3c7':ok?'#9dffb0':'#fff'; }
  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }

  async function load(){
    try{
      var uid=await HubAccount.ensureUser();
      var r=await HubAccount.client().from('player_progress').select('data').eq('game',GAME).maybeSingle();
      if(r.error) throw r.error;
      loaded=(r.data&&r.data.data)||{};
      if((loaded.best||0)>localBest()){ try{ localStorage.setItem('sg-best',String(loaded.best)); }catch(e){} }
    }catch(e){ loaded={}; }
  }
  async function save(sc,coins){
    status('Saving progress…');
    try{
      await loadP;
      var uid=await HubAccount.ensureUser();
      var d={
        best:Math.max(localBest(),(loaded.best||0),sc),
        totalCoins:(loaded.totalCoins||0)+coins,
        runs:(loaded.runs||0)+1,
        lastRun:{score:sc,coins:coins}
      };
      var r=await HubAccount.client().from('player_progress').upsert({user_id:uid,game:GAME,data:d,updated_at:new Date().toISOString()});
      if(r.error) throw r.error;
      loaded=d;
      status('Progress saved to your account ✓',true);
    }catch(e){
      status('Couldn\'t save online. Your best is kept on this device and will save after your next run when you\'re connected.',false);
    }
  }

  function renderAccount(){
    var box=document.getElementById('sgAcct'); if(!box) return;
    var u=(HubAccount.status()||{}).user;
    if(!u){ box.innerHTML=''; return; }
    if(!u.anonymous){
      box.innerHTML='Signed in as <b>'+esc(u.email||'your account')+'</b>. Your progress follows you to any device. <a href="#" id="sgOut" style="color:#ffd24a">Sign out</a>';
      document.getElementById('sgOut').onclick=function(e){ e.preventDefault(); HubAccount.signOut(); };
      return;
    }
    if(!showForm){
      box.innerHTML='<a href="#" id="sgOpen" style="color:#ffd24a;font-weight:700">Keep your progress: add an email and password</a>';
      document.getElementById('sgOpen').onclick=function(e){ e.preventDefault(); showForm=true; renderAccount(); };
      return;
    }
    box.innerHTML=
      '<div style="background:#1b0c2ecc;border-radius:14px;padding:10px">'+
      '<input id="sgEmail" type="email" placeholder="Email" autocomplete="email" style="width:100%;font:inherit;padding:8px;border-radius:8px;border:0;margin-bottom:6px">'+
      '<input id="sgPass" type="password" placeholder="Password (6+ characters)" autocomplete="new-password" style="width:100%;font:inherit;padding:8px;border-radius:8px;border:0;margin-bottom:6px">'+
      '<button id="sgGo" style="font-size:16px;padding:8px 14px;border-radius:12px;width:100%">Save to my account</button>'+
      '<div style="margin-top:8px"><a href="#" id="sgHave" style="color:#ffd24a">I already have an account: sign in instead</a></div>'+
      '<div id="sgMsg" style="margin-top:6px;min-height:1.2em"></div></div>';
    document.getElementById('sgGo').onclick=async function(){
      var em=document.getElementById('sgEmail').value.trim(), pw=document.getElementById('sgPass').value;
      var msg=document.getElementById('sgMsg');
      try{
        var r=await HubAccount.upgrade(em,pw);
        msg.textContent=r.needsConfirm?'Check your email and tap the link to confirm. Your progress is kept.':'Account created. Your progress is kept.';
      }catch(e){ msg.textContent=(e&&e.message)||'Could not create the account.'; }
    };
    document.getElementById('sgHave').onclick=async function(e){
      e.preventDefault();
      var em=document.getElementById('sgEmail').value.trim(), pw=document.getElementById('sgPass').value;
      var msg=document.getElementById('sgMsg');
      try{ await HubAccount.signIn(em,pw); msg.textContent='Signed in.'; }
      catch(err){ msg.textContent=(err&&err.message)||'Could not sign in.'; }
    };
  }

  HubAccount.onChange(function(){ renderAccount(); });
  loadP=load().then(function(){ renderAccount(); });

  var overEl=document.getElementById('over');
  if(overEl){
    new MutationObserver(function(){
      if(overEl.classList.contains('hide')){ saved=false; showForm=false; status(''); return; }
      if(!saved){ saved=true; save(num('score'),num('coins')); renderAccount(); }
    }).observe(overEl,{attributes:true,attributeFilter:['class']});
  }
})();
</script>
